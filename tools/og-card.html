<!doctype html>
<!-- Social card (img/og.png, 1200x630). Rendered by tools/build_icons.sh with headless
     Chrome at 2x and downscaled with lanczos. Typography follows the site: Newsreader
     (the self-hosted subsets in fonts/), paper #fbfaf7, ink #1a1a1a, muted #5c5a55,
     rule #e2dfd8. The image is the hero poster (media/hero.poster.webp): one frame of
     four real PROXY runs, Panda Hook / Panda Stack / UR5 Place / UR5 Pour. -->
<meta charset="utf-8">
<title>PROXY social card</title>
<style>
  @font-face {
    font-family: "Newsreader";
    src: url("../fonts/newsreader-latin.woff2") format("woff2");
    font-weight: 400 600; font-style: normal;
  }
  @font-face {
    font-family: "Newsreader";
    src: url("../fonts/newsreader-italic-latin.woff2") format("woff2");
    font-weight: 400 500; font-style: italic;
  }
  :root { --paper: #fbfaf7; --ink: #1a1a1a; --muted: #5c5a55; --rule: #e2dfd8; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  body {
    box-sizing: border-box;
    display: grid; grid-template-columns: minmax(0, 1fr) 600px; column-gap: 48px; align-items: center;
    padding: 0 56px 0 60px;
    font-family: "Newsreader", Georgia, serif; color: var(--ink);
    font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
  }
  h1 {
    margin: 0 0 18px; font-weight: 400; font-size: 128px; line-height: .9;
    letter-spacing: -.01em; font-variation-settings: "opsz" 72;
  }
  .subtitle {
    margin: 0; font-style: italic; font-size: 34px; line-height: 1.2; color: var(--muted);
    text-wrap: balance; font-variation-settings: "opsz" 36;
  }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 30px 0 22px; width: 100%; }
  .lab {
    margin: 0; display: flex; align-items: center; gap: 12px;
    font-size: 19px; line-height: 1.3; color: var(--muted); white-space: nowrap;
  }
  .lab img { width: 24px; height: 24px; flex: none; }
  .venue { margin: 12px 0 0; font-size: 19px; line-height: 1.35; color: var(--muted); text-wrap: balance; }
  .plate {
    border: 1px solid var(--rule); border-radius: 10px; overflow: hidden;
    background: var(--paper); line-height: 0;
  }
  .plate img { width: 100%; height: auto; display: block; }
</style>
<body>
  <div class="text">
    <h1>PROXY</h1>
    <p class="subtitle">Learning Object-Centric Manipulation Policies from a Single RGB-D Image</p>
    <hr>
    <p class="lab"><img src="favicon.svg" alt="">MIT CSAIL · Learning and Intelligent Systems Lab</p>
    <p class="venue">RSS 2026 workshops: Diffusion for Robot Learning · Data-Centric Robotics</p>
  </div>
  <div class="plate"><img src="../media/hero.poster.webp" alt="" width="1280" height="720"></div>
</body>
